# Resolve app:3000 per request through Docker's embedded DNS instead of at
# config-load time. This is what lets `nginx -t` validate this file without the
# app container running or resolvable.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    # No gzip block here on purpose: react-router-serve runs Express with
    # `compression`, so responses already arrive encoded and nginx just passes
    # them through. Enabling gzip here would need gzip_proxied and would only
    # re-do work the app already did.

    client_max_body_size 2m;

    # Answered by nginx itself, so it stays cheap and is never blocked by app
    # latency. compose only starts this container after app reports healthy,
    # so a 200 here means the whole stack is serving.
    location = /health {
        access_log   off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Vite writes content-hashed filenames here (e.g. entry.client-CV1xagaf.js),
    # so these are safe to cache permanently.
    location /assets/ {
        set $upstream app:3000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The only file in public/, and its name is not content-hashed — so a short
    # TTL rather than an immutable one.
    location = /favicon.ico {
        set $upstream app:3000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;

        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        set $upstream app:3000;
        proxy_pass http://$upstream$request_uri;

        # React Router streams its SSR response; buffering would hold the whole
        # document back until render finishes.
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
